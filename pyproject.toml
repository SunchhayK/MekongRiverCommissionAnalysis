[project]
name = "mekongds"
version = "0.1.0"
description = "Mekong flood forecasting and farm-action decision support - ADS final project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "statsmodels>=0.14",
    "geopandas>=0.14",
    "pyarrow>=15.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "jupytext>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mekongds"]

[tool.uv]
package = true

[tool.jupytext]
# notebooks/ keeps paired .ipynb (executed) + .py (percent, source of truth)
